apiVersion: v1
kind: Secret
metadata:
  name: cicd-web-secret
  namespace: cicd-workshop
type: Opaque
stringData: {}
# NOTE: Ne laissez PAS de secrets sensibles en clair dans le dépôt.
# Ce fichier est volontairement vide côté valeur pour forcer la création
# des vraies valeurs via une commande locale sécurisée :
#
# kubectl create secret generic cicd-web-secret \
#   --from-literal=API_KEY="<VALEUR_SECRETE>" \
#   -n cicd-workshop
#
# Si vous voulez un secret d'exemple pour des tests locaux, créez-le
# localement avec la commande ci-dessus plutôt que de committer ses valeurs.

